<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .register-container {
            max-width: 400px;
            margin: 70px auto;
            background: #fff;
            padding: 32px 36px 24px 36px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .register-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #1e7e34;
            margin-bottom: 22px;
        }
        .register-form label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }
        .register-form input[type="text"],
        .register-form input[type="email"],
        .register-form input[type="password"],
        .register-form input[type="tel"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .register-form button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .register-form button:hover {
            background: #0056b3;
        }
        .mobile-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
        }
        .mobile-row select,
        .mobile-row input {
            margin-bottom: 0;
        }
        .mobile-input {
            width: 100%;
            min-width: 0;
            flex: 1 1 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            padding: 8px;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-title">Create your account</div>
        <form class="register-form">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required placeholder="Enter your first name">

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required placeholder="Enter your last name">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address">

            <label for="password">Set Password</label>
            <input type="password" id="password" name="password" required placeholder="Set a password">

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" required placeholder="Enter your mobile number">

            <button type="submit">Register</button>
        </form>
    </div>
<script>
document.querySelector('.register-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const data = {
    firstName: document.getElementById('firstName').value,
    lastName: document.getElementById('lastName').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    mobile: document.getElementById('mobile').value
  };
  try {
    const res = await fetch('http://localhost:3001/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (res.ok && result.success) {
      alert('Registration successful!');
      window.location.href = 'user_login.html';
    } else {
      alert(result.error || 'Registration failed!');
    }
  } catch (err) {
    alert('Registration failed!');
  }
});
</script>
</body>
</html>
