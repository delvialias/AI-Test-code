<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Air Ticket</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .booking-container {
            max-width: 400px;
            margin: 70px auto;
            background: #fff;
            padding: 32px 36px 24px 36px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .booking-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #1e7e34;
            margin-bottom: 22px;
        }
        .booking-form label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }
        .booking-form input[type="text"],
        .booking-form input[type="date"],
        .booking-form input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .booking-form button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .booking-form button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <button id="logoutBtn" style="position:absolute;top:20px;right:30px;padding:7px 18px;background:#dc3545;color:#fff;border:none;border-radius:5px;font-size:1rem;cursor:pointer;">Logout</button>
    <div class="booking-container">
        <div class="booking-title">Book Air Ticket</div>
        <form class="booking-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required minlength="4" maxlength="16" pattern="[A-Za-z ]+" placeholder="Enter your name">

            <label for="from">From</label>
            <input type="text" id="from" name="from" required>

            <label for="to">To</label>
            <input type="text" id="to" name="to" required>

            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>

            <label for="tickets">Number of Tickets</label>
            <input type="number" id="tickets" name="tickets" min="1" required>

            <button type="submit">Book Ticket</button>
        </form>
    </div>
</body>
<script>
// Redirect to login if not logged in
const loggedInEmail = localStorage.getItem('loggedInUserEmail');
if (!loggedInEmail) {
    window.location.href = 'user_login.html';
}
// Logout button
document.getElementById('logoutBtn').onclick = function() {
    localStorage.removeItem('loggedInUserEmail');
    window.location.href = 'user_login.html';
};
</script>
</html>
